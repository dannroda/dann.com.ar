name: Sync and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * *' # daily store sync
  workflow_dispatch:

permissions:
  contents: write # commit synced store data
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci

      # A failing store keeps its previous data, so the site still deploys; the job is marked failed at the end.
      - id: sync
        continue-on-error: true
        run: npm run sync
      - name: Commit synced data
        run: |
          git add content/store content/games public/games
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync store data'
          git push

      - id: pages
        uses: actions/configure-pages@v6
      - run: npm run build
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5

      - if: steps.sync.outcome == 'failure'
        run: echo '::error::Store sync failed, see the sync step' && exit 1
